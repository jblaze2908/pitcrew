# Checks every PR and every push to main. Deploys are pull-based: the host's pitcrew.timer fetches main
# every 2 minutes and rolls out (build → health check → rollback on failure), so no secret here can reach the server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Lockfile uses the public registry
        # A laptop behind a company npm proxy records the proxy's URLs; CI and the host can't reach it. Packages are
        # identical (integrity hashes), so rewrite resolved hosts to https://registry.npmjs.org/ before committing.
        run: "! grep -E '\"resolved\": \"https?://' app/package-lock.json | grep -v '\"https://registry.npmjs.org/'"
      - name: Install (control plane)
        run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Typecheck and build (server and web)
        run: npm run typecheck && npm run build
        working-directory: app
      - name: Syntax check (plain JS outside the control plane)
        run: for f in brain/*.mjs computer/*.mjs computer/pointer/*.js deploy/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Shell scripts parse
        run: for f in computer/*.sh deploy/*.sh; do bash -n "$f"; done
