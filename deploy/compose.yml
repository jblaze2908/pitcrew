# Pitcrew on the host. Persistent: the control plane and the brain. Crew computers are started on demand by the app.
# Image tags come from the release env written by deploy/pull-update.sh (one tag per commit).
name: pitcrew
services:
  app:
    image: pitcrew-app:${PITCREW_TAG:-1}
    container_name: pitcrew-app
    restart: unless-stopped
    ports:
      - "172.17.0.1:8330:8330"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out, so bind mounts the app asks Docker for resolve on the host.
      - /srv/pitcrew:/srv/pitcrew
    environment:
      PITCREW_HOST: pitcrew.example.com
      PITCREW_MAX_COMPUTERS: "3"
      PITCREW_COMPUTER_IMAGE: pitcrew-computer:${PITCREW_COMPUTER_TAG:-1}
      PITCREW_CODE_IMAGE: pitcrew-px0:${PITCREW_CODE_TAG:-1}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Codex app-servers (one per active crew member), the LLM proxy and the exec gateway. No Docker socket,
  # no workspace mounts, its own network (it can't reach the app's API); it joins a bot's network only while that bot's computer is up.
  brain:
    image: pitcrew-brain:${PITCREW_TAG:-1}
    container_name: pitcrew-brain
    restart: unless-stopped
    user: "1500:1500"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/crew:size=64m,uid=1500,gid=1500,mode=700
    mem_limit: 2g
    pids_limit: 1024
    networks: [brainnet]
    volumes:
      - /srv/pitcrew/brains:/brains
      - /srv/pitcrew/chatgpt:/auth
      - /srv/pitcrew/run:/run/pitcrew
    environment:
      TZ: Asia/Kolkata
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  brainnet: {}
